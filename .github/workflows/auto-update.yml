# 自动检查并更新本 tap 中的 formula / cask 到上游最新版本（类似 Scoop 的 Excavator）。
# 每 12 小时检查一次；若有新版本，直接在本仓库 main 分支更新 version / sha256 并提交推送。
# 每个更新的软件单独提交，提交信息为固定格式：<软件名>: Update to version <新版本号>。
# 无新版本时不做任何改动、不产生提交。
name: auto-update

on:
  schedule:
    - cron: "0 */12 * * *" # 每 12 小时一次（整点）
  workflow_dispatch: # 支持手动触发一次

permissions:
  contents: write # 允许直接向本仓库提交

jobs:
  update:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 逐文件更新并单独提交。bump_* 每跑一次会改单个 .rb；
      # 若有改动，用固定格式提交：<软件名>: Update to version <新版本号>
      - name: Bump and commit casks
        run: |
          set -x
          shopt -s nullglob
          for f in Cask/*.rb; do
            name="$(basename "$f" .rb)"
            echo "==> Bumping cask: $name"
            brew bump-cask-pr --write-only "$name" || true
            if [ -n "$(git status --porcelain -- "$f")" ]; then
              version="$(grep -m1 '^  version "' "$f" | sed -E 's/^  version "([^"]*)".*/\1/')"
              [ -n "$version" ] || version="latest"
              git add "$f"
              git commit -m "$name: Update to version $version"
            fi
          done

      - name: Bump and commit formulae
        run: |
          set -x
          shopt -s nullglob
          for f in Formula/*.rb; do
            name="$(basename "$f" .rb)"
            echo "==> Bumping formula: $name"
            brew bump-formula-pr --write-only "$name" || true
            if [ -n "$(git status --porcelain -- "$f")" ]; then
              version="$(grep -m1 '^  version "' "$f" | sed -E 's/^  version "([^"]*)".*/\1/')"
              [ -n "$version" ] || version="latest"
              git add "$f"
              git commit -m "$name: Update to version $version"
            fi
          done

      - name: Push if changed
        run: |
          set -x
          if git log origin/main..HEAD | grep -q .; then
            git push origin main
          else
            echo "No updates found; nothing to commit or push."
          fi
