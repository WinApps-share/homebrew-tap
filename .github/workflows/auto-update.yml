# 每 12 小时通过 livecheck 检查上游版本；若有更新，则更新 version / sha256，
# 每个软件单独提交并直接推送到 main。无更新时不产生提交。
name: auto-update

on:
  schedule:
    - cron: "0 */12 * * *" # 每 12 小时一次（整点）
  workflow_dispatch: # 支持手动触发一次

permissions:
  contents: write # 允许直接向本仓库提交

concurrency:
  group: auto-update-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master
        with:
          # setup-homebrew 会重新布置 tap 工作区，因此需要显式持久 push 凭据。
          token: ${{ github.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Detect, bump and commit updates
        run: |
          set -euo pipefail
          tap="${GITHUB_REPOSITORY}"
          livecheck_output="$(mktemp)"
          livecheck_error="$(mktemp)"
          failures_file="$(mktemp)"
          trap 'rm -f "$livecheck_output" "$livecheck_error" "$failures_file"' EXIT

          checked_count=0
          updated_count=0
          failure_count=0

          # Homebrew 6.0+ requires explicit trust before loading formulae and
          # casks from a non-official tap. This workflow owns and updates the
          # checked-out tap, so trusting the whole tap is intentional here.
          brew trust "$tap"

          # 逐个检查，避免某个上游超时或配置错误中断整批更新。
          # 失败项会在日志和 job summary 中列出，但不阻止其他项目提交。
          shopt -s nullglob
          for file in Formula/*.rb Casks/*.rb; do
            case "$file" in
              Formula/*.rb) type="formula" ;;
              Casks/*.rb) type="cask" ;;
            esac
            name="$(basename "$file" .rb)"
            checked_count=$((checked_count + 1))
            : > "$livecheck_output"
            : > "$livecheck_error"

            echo "==> Checking $type: $name"
            if ! brew livecheck --quiet --newer-only --json "--$type" "$tap/$name" \
              >"$livecheck_output" 2>"$livecheck_error"; then
              echo "WARNING: livecheck failed for $type $name" >&2
              sed -n '1,120p' "$livecheck_error" >&2
              sed -n '1,120p' "$livecheck_output" >&2
              printf '%s\n' "- livecheck: $type \`$name\`" >> "$failures_file"
              failure_count=$((failure_count + 1))
              continue
            fi

            if ! jq -e 'type == "array"' "$livecheck_output" >/dev/null; then
              echo "WARNING: invalid livecheck JSON for $type $name" >&2
              sed -n '1,120p' "$livecheck_output" >&2
              printf '%s\n' "- invalid JSON: $type \`$name\`" >> "$failures_file"
              failure_count=$((failure_count + 1))
              continue
            fi

            update="$(jq -c '.[0] // empty' "$livecheck_output")"
            [[ -n "$update" ]] || continue
            version="$(jq -r '.version.latest // empty' <<<"$update")"
            if [[ -z "$version" ]]; then
              echo "WARNING: latest version missing for $type $name: $update" >&2
              printf '%s\n' "- missing version: $type \`$name\`" >> "$failures_file"
              failure_count=$((failure_count + 1))
              continue
            fi

            echo "==> Bumping $type: $name ($version)"
            if [[ "$type" == "cask" ]]; then
              if ! brew bump-cask-pr --write-only --version="$version" "$tap/$name"; then
                git restore -- "$file"
                printf '%s\n' "- bump: $type \`$name\` ($version)" >> "$failures_file"
                failure_count=$((failure_count + 1))
                continue
              fi
            else
              if ! brew bump-formula-pr --write-only --version="$version" "$tap/$name"; then
                git restore -- "$file"
                printf '%s\n' "- bump: $type \`$name\` ($version)" >> "$failures_file"
                failure_count=$((failure_count + 1))
                continue
              fi
            fi

            if ! git diff --quiet -- "$file"; then
              git add "$file"
              git commit -m "$name: Update to version $version"
              updated_count=$((updated_count + 1))
            fi
          done

          {
            echo "## Auto-update summary"
            echo
            echo "- Checked: $checked_count"
            echo "- Updated: $updated_count"
            echo "- Failed: $failure_count"
            if [[ "$failure_count" -gt 0 ]]; then
              echo
              echo "### Failed items"
              cat "$failures_file"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push if changed
        run: |
          set -x
          if git log origin/main..HEAD | grep -q .; then
            git push origin main
          else
            echo "No updates found; nothing to commit or push."
          fi
