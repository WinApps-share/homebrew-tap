# 每 12 小时通过 livecheck 检查上游版本；若有更新，则更新 version / sha256，
# 每个软件单独提交并直接推送到 main。无更新时不产生提交。
name: auto-update

on:
  schedule:
    - cron: "0 */12 * * *" # 每 12 小时一次（整点）
  workflow_dispatch: # 支持手动触发一次

permissions:
  contents: write # 允许直接向本仓库提交

concurrency:
  group: auto-update-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master
        with:
          # setup-homebrew 会重新布置 tap 工作区，因此需要显式持久 push 凭据。
          token: ${{ github.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Detect, bump and commit updates
        run: |
          set -euo pipefail
          tap="${GITHUB_REPOSITORY}"
          updates_file="$(mktemp)"

          # --newer-only 仅输出确实落后于上游的软件；探测失败会让任务失败，
          # 避免使用 `|| true` 将配置或网络错误伪装成“没有更新”。
          brew livecheck --tap="$tap" --newer-only --json --quiet > "$updates_file"

          jq -c '.[]' "$updates_file" | while IFS= read -r update; do
            if jq -e '.cask' >/dev/null <<<"$update"; then
              type="cask"
              name="$(jq -r '.cask' <<<"$update")"
              file="Casks/$name.rb"
            elif jq -e '.formula' >/dev/null <<<"$update"; then
              type="formula"
              name="$(jq -r '.formula' <<<"$update")"
              file="Formula/$name.rb"
            else
              echo "Invalid livecheck result: $update" >&2
              exit 1
            fi
            version="$(jq -r '.version.latest' <<<"$update")"
            if [[ -z "$version" || "$version" == "null" ]]; then
              echo "Missing latest version in livecheck result: $update" >&2
              exit 1
            fi

            echo "==> Bumping $type: $name ($version)"
            if [[ "$type" == "cask" ]]; then
              brew bump-cask-pr --write-only --version="$version" "$tap/$name"
            else
              brew bump-formula-pr --write-only --version="$version" "$tap/$name"
            fi

            if ! git diff --quiet -- "$file"; then
              git add "$file"
              git commit -m "$name: Update to version $version"
            fi
          done

      - name: Push if changed
        run: |
          set -x
          if git log origin/main..HEAD | grep -q .; then
            git push origin main
          else
            echo "No updates found; nothing to commit or push."
          fi
