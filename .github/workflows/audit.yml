# 提交/PR 时只审计本次变更的 formula 与 cask。
name: brew audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Cache Homebrew Bundler RubyGems
        id: cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - name: Install Homebrew Bundler RubyGems
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install-bundler-gems

      - name: Audit changed formulae and casks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TAP: ${{ github.repository }}
        run: |
          set -euo pipefail

          # push 检查该次 push 的净变更；PR 检查 base 与 head 之间的净变更。
          # 已删除的清单无法交给 Homebrew 审计，因此跳过。
          changed_count=0
          while IFS= read -r file; do
            [[ -f "$file" ]] || continue

            case "$file" in
              Formula/*.rb)
                type="formula"
                ;;
              Casks/*.rb)
                type="cask"
                ;;
              *)
                continue
                ;;
            esac

            token="$(basename "$file" .rb)"
            name="$TAP/$token"
            echo "==> Auditing changed $type: $name"
            brew audit --strict --online "--$type" "$name"
            brew style "--$type" "$name"
            changed_count=$((changed_count + 1))
          done < <(git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA" -- Formula Casks)

          if [[ "$changed_count" -eq 0 ]]; then
            echo "No changed formulae or casks to audit."
          fi
